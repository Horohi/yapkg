name: Package registry

on:
  pull_request:
    branches: [packages]
    paths: ["packages/**"]
  push:
    branches: [packages]
    paths: ["packages/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_index.py --packages-dir packages --validate

  publish-index:
    if: github.event_name == 'push' && github.ref == 'refs/heads/packages'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: packages
          fetch-depth: 0
      - name: Build static index
        run: >-
          python3 tools/build_index.py
          --packages-dir packages
          --base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/packages/packages"
          --output /tmp/index.json
      - name: Publish index branch
        run: |
          git fetch origin registry
          git checkout -B registry origin/registry
          cp /tmp/index.json index.json
          if git diff --quiet -- index.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "ci: update package index"
          git push origin registry
